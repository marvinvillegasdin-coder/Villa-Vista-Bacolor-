<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Villa Vista Bacolor — Chat with Us</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream: #faf6f0;
    --sand: #e8dcc8;
    --terracotta: #c4714a;
    --terracotta-dark: #a85a36;
    --forest: #3a5a40;
    --forest-light: #4e7a57;
    --text: #2c2416;
    --text-muted: #7a6a54;
    --bubble-user: #3a5a40;
    --bubble-bot: #ffffff;
    --shadow: 0 8px 32px rgba(60,40,10,0.13);
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background-image:
      radial-gradient(ellipse at 20% 20%, rgba(196,113,74,0.08) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 80%, rgba(58,90,64,0.08) 0%, transparent 60%);
  }

  .chat-wrapper {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    height: 92vh;
    max-height: 800px;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: var(--shadow), 0 2px 8px rgba(196,113,74,0.08);
    border: 1px solid rgba(232,220,200,0.7);
    background: var(--cream);
  }

  /* Header */
  .chat-header {
    background: var(--forest);
    padding: 18px 20px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    position: relative;
    overflow: hidden;
  }
  .chat-header::before {
    content: '';
    position: absolute;
    top: -30px; right: -30px;
    width: 120px; height: 120px;
    background: rgba(255,255,255,0.04);
    border-radius: 50%;
  }
  .chat-header::after {
    content: '';
    position: absolute;
    bottom: -20px; left: 40px;
    width: 80px; height: 80px;
    background: rgba(196,113,74,0.15);
    border-radius: 50%;
  }
  .avatar {
    width: 48px; height: 48px;
    background: var(--terracotta);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
    border: 2px solid rgba(255,255,255,0.2);
    position: relative; z-index: 1;
  }
  .header-info { flex: 1; position: relative; z-index: 1; }
  .header-name {
    font-family: 'Playfair Display', serif;
    font-size: 17px;
    color: #fff;
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  .header-sub {
    font-size: 12px;
    color: rgba(255,255,255,0.65);
    margin-top: 2px;
    display: flex; align-items: center; gap: 5px;
  }
  .online-dot {
    width: 7px; height: 7px;
    background: #6ee77a;
    border-radius: 50%;
    display: inline-block;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* Messages area */
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
  }
  .chat-messages::-webkit-scrollbar { width: 4px; }
  .chat-messages::-webkit-scrollbar-thumb { background: var(--sand); border-radius: 4px; }

  /* Date divider */
  .date-divider {
    text-align: center;
    font-size: 11px;
    color: var(--text-muted);
    margin: 4px 0;
    display: flex; align-items: center; gap: 8px;
  }
  .date-divider::before, .date-divider::after {
    content: ''; flex: 1; height: 1px; background: var(--sand);
  }

  /* Bubbles */
  .message-row {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    animation: fadeUp 0.3s ease;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .message-row.user { flex-direction: row-reverse; }

  .bubble-avatar {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--terracotta);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    flex-shrink: 0;
    margin-bottom: 2px;
  }

  .bubble {
    max-width: 78%;
    padding: 11px 15px;
    border-radius: 18px;
    font-size: 14px;
    line-height: 1.55;
    color: var(--text);
    position: relative;
  }
  .bubble.bot {
    background: var(--bubble-bot);
    border-bottom-left-radius: 4px;
    box-shadow: 0 2px 8px rgba(60,40,10,0.08);
  }
  .bubble.user {
    background: var(--bubble-user);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .bubble-time {
    font-size: 10px;
    color: var(--text-muted);
    margin-top: 4px;
    text-align: right;
  }
  .bubble.user + .bubble-time { text-align: right; }

  /* Typing indicator */
  .typing-indicator {
    display: flex; align-items: center; gap: 5px;
    padding: 12px 16px;
    background: #fff;
    border-radius: 18px;
    border-bottom-left-radius: 4px;
    width: fit-content;
    box-shadow: 0 2px 8px rgba(60,40,10,0.08);
  }
  .typing-dot {
    width: 7px; height: 7px;
    background: var(--text-muted);
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-6px); }
  }

  /* Quick replies */
  .quick-replies {
    display: flex; flex-wrap: wrap; gap: 8px;
    padding: 0 16px 12px;
  }
  .quick-btn {
    background: #fff;
    border: 1.5px solid var(--sand);
    color: var(--forest);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    padding: 7px 14px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.18s;
    font-weight: 500;
  }
  .quick-btn:hover {
    background: var(--forest);
    color: #fff;
    border-color: var(--forest);
    transform: translateY(-1px);
  }

  /* Input area */
  .chat-input-area {
    padding: 12px 14px 16px;
    background: #fff;
    border-top: 1px solid var(--sand);
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  .chat-input {
    flex: 1;
    border: 1.5px solid var(--sand);
    border-radius: 22px;
    padding: 10px 16px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--text);
    background: var(--cream);
    outline: none;
    resize: none;
    max-height: 100px;
    line-height: 1.4;
    transition: border-color 0.18s;
  }
  .chat-input:focus { border-color: var(--forest); }
  .chat-input::placeholder { color: var(--text-muted); }

  .send-btn {
    width: 42px; height: 42px;
    border-radius: 50%;
    background: var(--terracotta);
    border: none;
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: background 0.18s, transform 0.12s;
  }
  .send-btn:hover { background: var(--terracotta-dark); transform: scale(1.07); }
  .send-btn:disabled { background: var(--sand); cursor: not-allowed; transform: none; }

  /* Escalation card */
  .escalation-card {
    background: linear-gradient(135deg, #fdf3ec, #f5e8d5);
    border: 1.5px solid var(--terracotta);
    border-radius: 14px;
    padding: 14px 16px;
    margin-top: 4px;
    font-size: 13.5px;
    color: var(--text);
  }
  .escalation-card .esc-title {
    font-weight: 600;
    color: var(--terracotta-dark);
    margin-bottom: 8px;
    display: flex; align-items: center; gap: 6px;
    font-size: 14px;
  }
  .esc-links { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .esc-link {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--terracotta);
    color: #fff;
    text-decoration: none;
    padding: 7px 13px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 500;
    width: fit-content;
    transition: background 0.18s;
  }
  .esc-link:hover { background: var(--terracotta-dark); }

  /* Booking form */
  .booking-form {
    background: #fff;
    border-radius: 14px;
    padding: 16px;
    box-shadow: 0 2px 8px rgba(60,40,10,0.08);
    display: flex; flex-direction: column; gap: 10px;
    margin-top: 4px;
  }
  .booking-form input, .booking-form select {
    border: 1.5px solid var(--sand);
    border-radius: 10px;
    padding: 9px 13px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    color: var(--text);
    outline: none;
    background: var(--cream);
    transition: border-color 0.18s;
  }
  .booking-form input:focus, .booking-form select:focus { border-color: var(--forest); }
  .booking-form label { font-size: 12px; color: var(--text-muted); font-weight: 500; margin-bottom: -6px; }
  .form-submit {
    background: var(--forest);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.18s;
    margin-top: 2px;
  }
  .form-submit:hover { background: var(--forest-light); }
</style>
</head>
<body>

<div class="chat-wrapper">
  <!-- Header -->
  <div class="chat-header">
    <div class="avatar">🏡</div>
    <div class="header-info">
      <div class="header-name">Villa Vista Bacolor</div>
      <div class="header-sub">
        <span class="online-dot"></span>
        Vista — your virtual assistant
      </div>
    </div>
  </div>

  <!-- Messages -->
  <div class="chat-messages" id="chatMessages">
    <div class="date-divider">Today</div>
    <!-- Welcome message injected by JS -->
  </div>

  <!-- Quick replies -->
  <div class="quick-replies" id="quickReplies"></div>

  <!-- Input -->
  <div class="chat-input-area">
    <textarea class="chat-input" id="chatInput" placeholder="Type your message..." rows="1"></textarea>
    <button class="send-btn" id="sendBtn">➤</button>
  </div>
</div>

<script>
const VILLA_SYSTEM_PROMPT = `You are "Vista", a friendly and helpful virtual assistant for Villa Vista Bacolor — a private vacation villa in Concepcion, Bacolor, Pampanga, Philippines.

Your personality: Warm, casual, and welcoming — like a trusted friend who knows the villa inside out. You speak both English and Filipino/Tagalog naturally, mixing them the way Filipinos do (Taglish is totally fine). Use emojis occasionally to keep things friendly and lively.

VILLA DETAILS:
- Name: Villa Vista Bacolor
- Address: Concepcion, Bacolor, Pampanga (along a barangay road)
- Contact: +63 994 544 5987
- Facebook: Villa Vista Bacolor

PROPERTY:
- 3-4 bedrooms, good for up to 20 guests
- Perfect for: overnight stays/staycation, day use/swimming, birthday parties, reunions, and weddings/debuts

AMENITIES:
- Private swimming pool 🏊
- Kiddie pool 👶
- Videoke / karaoke 🎤
- BBQ / grill area 🔥

RATES (approximate, subject to confirmation):
- Overnight: ₱12,000 – ₱20,000 (whole villa)
- Day use: ₱8,000 and above
- Final rates depend on date, number of guests, and type of booking — always encourage them to message for exact quote

BOOKING:
- How to book: Facebook Messenger, SMS, phone call, or Viber/WhatsApp
- Downpayment: 50% to confirm reservation
- Payment methods: GCash, bank transfer, or cash on arrival

HOUSE RULES / POLICIES:
- Check-in: 2:00 PM
- Check-out: 12:00 PM (noon)
- Outside food and drinks: ALLOWED 🎉
- Pets: Small pets only 🐾
- Cancellation: Full refund if cancelled at least 7 days before the booking date. No refund for cancellations within 7 days.

WHAT YOU CAN DO:
1. Answer FAQs about the villa
2. Help guests understand availability (tell them to message the owner directly to check specific dates)
3. Collect guest info for booking inquiries (name, date, number of guests, type of stay)
4. Escalate to the human owner for final confirmation — share contact details when needed

ESCALATION:
When a guest is ready to book or needs final confirmation, say something like: "Para ma-confirm ang inyong booking, i-message na lang natin si Ate/Kuya directly! Here are the ways to reach them:" and show their contact options.

IMPORTANT RULES:
- Never make up information not listed above
- If unsure, say you'll forward the question to the owner
- Always be helpful, never robotic
- Keep responses concise and conversational — not too long
- If asked for exact availability, always clarify that the owner needs to confirm specific dates`;

const quickReplySets = {
  welcome: ["📋 Rates & Pricing", "🏡 Amenities", "📅 Check Availability", "📞 How to Book", "🐾 Pet Policy"],
  afterAnswer: ["📋 Rates & Pricing", "📅 Check Availability", "📞 How to Book", "✅ I want to book!"],
  booking: ["✅ I want to book!", "📞 Contact Owner"]
};

let conversationHistory = [];
let isTyping = false;

function getTime() {
  return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function addMessage(content, sender, isHtml = false) {
  const messages = document.getElementById('chatMessages');
  const row = document.createElement('div');
  row.className = `message-row ${sender}`;

  const avatarEl = document.createElement('div');
  avatarEl.className = 'bubble-avatar';
  avatarEl.textContent = sender === 'bot' ? '🏡' : '👤';

  const col = document.createElement('div');
  col.style.display = 'flex';
  col.style.flexDirection = 'column';
  col.style.maxWidth = '80%';
  col.style.alignItems = sender === 'user' ? 'flex-end' : 'flex-start';

  const bubble = document.createElement('div');
  bubble.className = `bubble ${sender}`;
  if (isHtml) bubble.innerHTML = content;
  else bubble.textContent = content;

  const time = document.createElement('div');
  time.className = 'bubble-time';
  time.textContent = getTime();

  col.appendChild(bubble);
  col.appendChild(time);

  if (sender === 'bot') {
    row.appendChild(avatarEl);
    row.appendChild(col);
  } else {
    row.appendChild(col);
    row.appendChild(avatarEl);
  }

  messages.appendChild(row);
  messages.scrollTop = messages.scrollHeight;
  return bubble;
}

function showTyping() {
  const messages = document.getElementById('chatMessages');
  const row = document.createElement('div');
  row.className = 'message-row bot';
  row.id = 'typingRow';

  const avatarEl = document.createElement('div');
  avatarEl.className = 'bubble-avatar';
  avatarEl.textContent = '🏡';

  const indicator = document.createElement('div');
  indicator.className = 'typing-indicator';
  indicator.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';

  row.appendChild(avatarEl);
  row.appendChild(indicator);
  messages.appendChild(row);
  messages.scrollTop = messages.scrollHeight;
}

function removeTyping() {
  const row = document.getElementById('typingRow');
  if (row) row.remove();
}

function setQuickReplies(set) {
  const container = document.getElementById('quickReplies');
  container.innerHTML = '';
  const replies = quickReplySets[set] || [];
  replies.forEach(label => {
    const btn = document.createElement('button');
    btn.className = 'quick-btn';
    btn.textContent = label;
    btn.onclick = () => sendMessage(label);
    container.appendChild(btn);
  });
}

function showEscalation() {
  return `<div class="escalation-card">
    <div class="esc-title">📲 Contact Villa Vista Bacolor</div>
    Para ma-confirm ang inyong booking, maaari kayong makipag-ugnayan sa amin dito:
    <div class="esc-links">
      <a class="esc-link" href="https://m.me/VillaVistaBacolor" target="_blank">💬 Facebook Messenger</a>
      <a class="esc-link" href="sms:+639945445987">📱 SMS: +63 994 544 5987</a>
      <a class="esc-link" href="viber://chat?number=+639945445987">📞 Viber / WhatsApp</a>
    </div>
  </div>`;
}

function showBookingForm() {
  return `<div class="booking-form">
    <strong style="font-size:14px;color:var(--forest)">📋 Booking Inquiry Form</strong>
    <label>Full Name</label>
    <input type="text" id="bf-name" placeholder="Juan dela Cruz" />
    <label>Date of Stay</label>
    <input type="date" id="bf-date" />
    <label>Type of Stay</label>
    <select id="bf-type">
      <option value="">Select...</option>
      <option>Overnight Stay</option>
      <option>Day Use</option>
      <option>Event / Party</option>
      <option>Wedding / Debut</option>
    </select>
    <label>Number of Guests</label>
    <input type="number" id="bf-guests" placeholder="e.g. 10" min="1" max="20" />
    <button class="form-submit" onclick="submitBookingForm()">Send Inquiry ✉️</button>
  </div>`;
}

function submitBookingForm() {
  const name = document.getElementById('bf-name').value;
  const date = document.getElementById('bf-date').value;
  const type = document.getElementById('bf-type').value;
  const guests = document.getElementById('bf-guests').value;

  if (!name || !date || !type || !guests) {
    alert('Please fill in all fields!');
    return;
  }

  const summary = `Name: ${name}\nDate: ${date}\nType: ${type}\nGuests: ${guests}`;
  sendMessage(`I'd like to inquire about a booking!\n${summary}`);
}

async function sendMessage(text) {
  if (!text.trim() || isTyping) return;
  isTyping = true;

  document.getElementById('chatInput').value = '';
  document.getElementById('quickReplies').innerHTML = '';
  addMessage(text, 'user');

  conversationHistory.push({ role: 'user', content: text });

  showTyping();
  document.getElementById('sendBtn').disabled = true;

  // Check for escalation/booking triggers
  const lowerText = text.toLowerCase();
  const wantsToBook = lowerText.includes('book') || lowerText.includes('reserve') || lowerText.includes('i want to book') || lowerText.includes('mag-book') || lowerText.includes('contact owner');

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: VILLA_SYSTEM_PROMPT,
        messages: conversationHistory
      })
    });

    const data = await response.json();
    removeTyping();

    const reply = data.content?.[0]?.text || "Sorry, may problema sa connection. Please try again!";
    conversationHistory.push({ role: 'assistant', content: reply });

    addMessage(reply, 'bot');

    // Show escalation card if booking intent detected
    if (wantsToBook || reply.toLowerCase().includes('contact') || reply.toLowerCase().includes('confirm')) {
      const messages = document.getElementById('chatMessages');
      const row = document.createElement('div');
      row.className = 'message-row bot';
      const col = document.createElement('div');
      col.style.maxWidth = '90%';
      col.innerHTML = showEscalation();
      row.appendChild(col);
      messages.appendChild(row);
      messages.scrollTop = messages.scrollHeight;
      setQuickReplies('welcome');
    } else if (lowerText.includes('inquiry') || lowerText.includes('inquire')) {
      const messages = document.getElementById('chatMessages');
      const row = document.createElement('div');
      row.className = 'message-row bot';
      const col = document.createElement('div');
      col.style.maxWidth = '90%';
      col.innerHTML = showBookingForm();
      row.appendChild(col);
      messages.appendChild(row);
      messages.scrollTop = messages.scrollHeight;
    } else {
      setQuickReplies('afterAnswer');
    }

  } catch (err) {
    removeTyping();
    addMessage('Oops! May problema sa connection. Please try again in a moment. 😊', 'bot');
    setQuickReplies('welcome');
  }

  isTyping = false;
  document.getElementById('sendBtn').disabled = false;
}

// Input auto-resize and enter key
const input = document.getElementById('chatInput');
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 100) + 'px';
});
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage(input.value);
  }
});
document.getElementById('sendBtn').onclick = () => sendMessage(input.value);

// Welcome message
window.onload = () => {
  setTimeout(() => {
    addMessage('Mabuhay! 🌿 Welcome to Villa Vista Bacolor! I\'m Vista, your virtual assistant. How can I help you today?\n\nAsk me anything about our villa — rates, amenities, availability, or how to book! 😊', 'bot');
    setQuickReplies('welcome');
  }, 500);
};
</script>
</body>
</html>
